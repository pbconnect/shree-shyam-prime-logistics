<script>
const PRICING = {
  baseFare: 500,
  includedKm: 0,
  perKm: 35,
  minFare: 500
};

const rupee = n => "₹" + Math.round(n).toLocaleString("en-IN");

const kmInput = document.getElementById("km");
const loadingInput = document.getElementById("loading");
const waitingInput = document.getElementById("waiting");

const baseEl = document.getElementById("base");
const distEl = document.getElementById("dist");
const loadEl = document.getElementById("load");
const waitEl = document.getElementById("wait");
const sumEl = document.getElementById("sum");
const totalEl = document.getElementById("total");

function fare() {
  const km = Math.max(
    0,
    parseFloat(kmInput.value.replace(",", ".")) || 0
  );

  const load = Number(loadingInput.value) || 0;
  const wait = Number(waitingInput.value) || 0;

  const distanceFare =
    Math.max(0, km - PRICING.includedKm) * PRICING.perKm;

  const total = Math.max(
    PRICING.minFare,
    PRICING.baseFare + distanceFare + load + wait
  );

  baseEl.textContent = rupee(PRICING.baseFare);
  distEl.textContent = rupee(distanceFare);
  loadEl.textContent = rupee(load);
  waitEl.textContent = rupee(wait);
  sumEl.textContent = rupee(total);
  totalEl.textContent = rupee(total);

  return total;
}

document.querySelectorAll("input, select").forEach(el => {
  el.addEventListener("input", fare);
  el.addEventListener("change", fare);
});

async function createBooking() {
  const phone = document.getElementById("phone").value.trim();
  const pickup = document.getElementById("pickup").value.trim();
  const drop = document.getElementById("drop").value.trim();
  const goods = document.getElementById("goods").value;

  const km = parseFloat(kmInput.value) || 0;
  const loading = Number(loadingInput.value) || 0;
  const waiting = Number(waitingInput.value) || 0;

  if (!pickup || !drop) {
    alert("Pickup aur Drop bhariye.");
    return;
  }

  const body = {
    phone,
    pickup,
    drop,
    km,
    goods,
    loading,
    waiting,
    fare: fare()
  };

  try {
    const r = await fetch("/api/bookings", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });

    const x = await r.json();

    const msg = document.getElementById("msg");
    msg.style.display = "block";
    msg.innerHTML =
      "Booking ID: <b>" +
      x.id +
      "</b> — Driver assignment ke liye request bhej di gayi.";
  } catch (e) {
    const msg = document.getElementById("msg");
    msg.style.display = "block";
    msg.textContent =
      "Demo mode: booking locally ready. Server start karne par live booking save hogi.";
  }
}

function sendWhatsApp() {
  const pickup = document.getElementById("pickup").value;
  const drop = document.getElementById("drop").value;
  const goods = document.getElementById("goods").value;

  const text =
    "Shree Shyam Prime Logistics\n" +
    "Vehicle: Mahindra Veero 10 Feet\n" +
    "Pickup: " + pickup + "\n" +
    "Drop: " + drop + "\n" +
    "Distance: " + kmInput.value + " KM\n" +
    "Goods: " + goods + "\n" +
    "Estimated Fare: " + rupee(fare());

  window.open(
    "https://wa.me/919711402957?text=" +
    encodeURIComponent(text),
    "_blank"
  );
}

fare();
</script>
